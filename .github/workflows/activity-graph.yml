name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Update setiap hari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: HowardZlh/github-action-shares@v1
        with:
          command: 'user'
          user: 'LimunBF'
          output_dir: 'assets'
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Update activity graph"
          git push
