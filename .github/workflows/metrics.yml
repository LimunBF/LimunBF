name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap hari
  workflow_dispatch: # Bisa dijalankan manual

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LimunBF
          filename: github-metrics.svg
          
          # --- KONFIGURASI GRAFIK ---
          # Hapus tanda '#' di depan salah satu baris di bawah ini untuk mengaktifkan tampilannya.

          # OPSI A: Activity Graph Klasik (Mendekati tampilan asli)
          # plugin_activity: yes
          # plugin_activity_limit: 5
          # plugin_activity_load: 300
          # plugin_activity_days: 14
          # plugin_activity_filter: all

          # OPSI B: Isometric Calendar (3D Kalender Kontribusi)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta
